aid: airtouch
name: Airtouch
description: >-
  AirTouch (Shanghai) Intelligent Technology Co., Ltd. (隔空科技) is a Shanghai-based fabless
  semiconductor company founded in November 2017 that designs microwave and millimeter-wave radar
  sensor chips — 5.8 GHz, 10.525 GHz, 24 GHz, 60 GHz and 77 GHz series, including SoC parts with an
  integrated 32-bit MCU and antenna-in-package (AiP) variants — for smart lighting, security,
  home appliances, smart home and automotive / two-wheeler ADAS. Backed by Intel Capital, Xiaomi,
  TCL Venture Capital and Fosun, with R&D centers in Ningbo, Guangzhou and Shenzhen. The company
  sells silicon, modules and reference designs and publishes no public API, SDK, developer portal
  or machine-readable contract.
